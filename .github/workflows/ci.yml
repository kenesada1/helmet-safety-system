name: production-gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      ULTRALYTICS_SETTINGS_DIR: ${{ github.workspace }}/.ultralytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install locked project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements/ci.lock -e ".[test,inference,deployment,service]"
      - name: Check dependency policy
        run: python scripts/ci/check_dependencies.py
      - name: Run full test suite
        run: python -m pytest
      - name: Run one-epoch CPU training smoke
        run: python scripts/ci/run_training_smoke.py --output artifacts/ci-smoke
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-epoch-training-smoke
          path: |
            artifacts/ci-smoke/smoke_report.json
            artifacts/ci-smoke/runs/one_epoch/results.csv
          if-no-files-found: warn
          retention-days: 14

